[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-medical-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "pymongo>=4.10,<5",
  "PyJWT>=2.10,<3", "argon2-cffi>=23,<26", "email-validator>=2,<3",
  "python-multipart>=0.0.18,<1", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "presidio-analyzer>=2.2.364,<3", "presidio-anonymizer>=2.2.364,<3",
  "langchain-text-splitters>=1.1,<2", "langchain-openai>=1.6,<2",
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
huggingface = ["sentence-transformers>=3.3,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["database/indexes/*.json"]
